<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Her Little Rose</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Cairo:wght@700&family=Aref+Ruqaa:wght@700&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Cairo:wght@700&family=Aref+Ruqaa:wght@700&display=swap"></noscript>
<style>
:root{--bg:#fff1f5;--bg2:#ffd9e6;--fg:#5a2a44;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1620;--bg2:#1c0f16;--fg:#ffd9e6;--card:#3b2030}}
:root[data-theme="dark"]{--bg:#2a1620;--bg2:#1c0f16;--fg:#ffd9e6;--card:#3b2030}
html,body{height:100%;margin:0}
body{background:linear-gradient(var(--bg),var(--bg2));color:var(--fg);font-family:'Press Start 2P',monospace,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center}
#w{width:min(96vw,900px)}
#ttl{text-align:center;font-size:12px;margin-bottom:10px;letter-spacing:1px}
#hud{display:flex;justify-content:space-between;align-items:center;font-size:10px;margin-bottom:8px}
#hud div{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
#cw{position:relative}
canvas{width:100%;display:block;image-rendering:pixelated;border:4px solid var(--fg);border-radius:8px;background:#000;box-shadow:0 6px 0 var(--fg),0 10px 24px #e0507a55}
#greet{position:absolute;left:50%;top:9%;transform:translateX(-50%);width:80%;background:var(--card);border:3px solid var(--fg);border-radius:14px;padding:10px 14px;text-align:center;font-family:'Cairo',sans-serif;opacity:0;transition:opacity .7s;pointer-events:none;line-height:1.6}
#greet.show{opacity:1}
#g1{font-size:clamp(14px,3.6vw,24px)}#g2{font-size:clamp(11px,2.6vw,16px);opacity:.85}
#msg{min-height:40px;font-size:10px;line-height:1.7;background:var(--card);border:3px solid var(--fg);border-radius:6px;padding:8px;margin-top:12px}
#pad{display:flex;justify-content:space-between;margin-top:8px}
#pad div{display:flex;gap:8px}
.b{font:inherit;font-size:16px;width:58px;height:48px;border:3px solid var(--fg);background:var(--card);color:var(--fg);border-radius:8px;touch-action:none;user-select:none;-webkit-user-select:none}
.b:active{transform:translateY(2px)}
.b.s{width:34px;height:28px;font-size:12px}
#end{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:20px}
[hidden]{display:none!important}
.card{background:var(--card);border:4px solid var(--fg);border-radius:10px;padding:20px;max-width:440px;max-height:88vh;overflow:auto;text-align:center;font-size:11px;line-height:1.9}
#note{font-family:'Cairo',sans-serif;font-size:clamp(14px,3.8vw,18px);line-height:2;direction:rtl}
.sign{position:absolute;transform:translate(-50%,-50%);font-family:'Cairo',sans-serif;font-weight:700;font-size:calc(var(--u,3px)*5.2);line-height:1.35;text-align:center;direction:rtl;padding:calc(var(--u,3px)*1) calc(var(--u,3px)*1.5);border:calc(var(--u,3px)*.7) solid #5a2a44;border-radius:calc(var(--u,3px)*2);pointer-events:none;color:#5a2a44}
.sign.u{background:#fff59d;width:calc(var(--u,3px)*25)}
.sign.m{background:#ffd9e6;white-space:nowrap}
.sign.n{background:#1a1230;color:#ff8fab;border-color:#ff8fab;white-space:nowrap;text-shadow:0 0 6px #ff4f81}
.sign.w{background:transparent;white-space:nowrap;font-family:'Aref Ruqaa','Cairo',serif;font-size:calc(var(--u,3px)*5.6);color:#6a3fa0;border:calc(var(--u,3px)*1.1) double #a1704a;border-radius:calc(var(--u,3px)*2);padding:calc(var(--u,3px)*.8) calc(var(--u,3px)*2);text-shadow:0 1px 0 rgba(255,255,255,.5);box-shadow:0 0 0 calc(var(--u,3px)*.4) rgba(255,255,255,.35)}
.sign.w.p{color:#c2185b}

#pc{position:fixed;inset:0;z-index:6;background:rgba(30,12,22,.85);display:flex;align-items:center;justify-content:center;padding:12px;animation:gf .3s}
.win{position:relative;width:min(94vw,420px);max-height:92vh;overflow:auto;background:var(--card);border:4px solid var(--fg);border-radius:12px;box-shadow:0 6px 0 var(--fg)}
.bar{display:flex;justify-content:space-between;align-items:center;background:#f48fb1;color:#5a2a44;padding:8px 10px;font-size:10px;border-bottom:4px solid var(--fg)}
#pb{padding:12px;text-align:center;font-size:10px;line-height:1.8}
.mt{font-family:'Cairo',sans-serif;font-weight:700;font-size:16px;margin-bottom:10px}
.gb{display:block;width:100%;margin:8px 0;padding:12px;font:inherit;font-size:11px;background:var(--card);color:var(--fg);border:3px solid var(--fg);border-radius:10px;cursor:pointer}
.gb small{display:block;font-size:8px;opacity:.7;margin-top:4px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid4,.grid3{display:grid;gap:8px;margin:12px auto}
.grid4{grid-template-columns:repeat(4,minmax(0,1fr));width:min(76vw,320px)}
.grid3{grid-template-columns:repeat(3,minmax(0,1fr));width:min(66vw,270px)}
.card,.hole{min-width:0;overflow:hidden;aspect-ratio:1;border:3px solid var(--fg);border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;color:var(--fg);padding:0}
.card{background:#f48fb1;font-size:0}
.card i{font-style:normal;font-size:clamp(22px,7vw,34px);opacity:0;transition:opacity .2s}
.card.on,.card.ok{background:#fff}.card.ok{background:#c8e6c9}
.card.on i,.card.ok i{opacity:1}
.hole{background:#8d6e63;font-size:clamp(24px,8vw,38px);touch-action:manipulation}
#cc{width:min(84vw,300px);height:auto;aspect-ratio:300/360;border:3px solid var(--fg);border-radius:10px;margin-top:10px;touch-action:none;background:#ffe3ef}
.hint{margin-top:8px;font-family:'Cairo',sans-serif;font-size:13px;opacity:.8}
.win2{position:absolute;inset:0;background:rgba(255,255,255,.94);color:#5a2a44;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-family:'Cairo',sans-serif;font-weight:700;font-size:20px;line-height:1.7;border-radius:8px;text-align:center}
.lv{flex-direction:column;font-size:clamp(20px,6vw,28px);background:#f8bbd0;color:#5a2a44}.lv:disabled{background:#8d6e63;opacity:.6;cursor:default}.lv small{font-size:12px}
#tn{text-align:center;font-size:8px;opacity:.75;margin:-4px 0 8px;min-height:10px}
#fx{position:fixed;inset:0;z-index:7;background:linear-gradient(#1b1030,#2d1b4e);color:#ffd9e6;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;animation:gf .5s}
#fxc{max-width:420px;width:100%}
.big{font-size:clamp(34px,12vw,64px);margin:18px 0;letter-spacing:2px}
.bar2{height:12px;border:3px solid #ffd9e6;border-radius:8px;overflow:hidden}
#bf{height:100%;width:0;background:#ff8fab;transition:width .5s}
.ar{font-family:'Cairo',sans-serif;font-weight:700;font-size:16px;line-height:1.9;direction:rtl}
.ar small{display:block;font-size:12px;opacity:.75;margin-top:6px}
#ff{position:absolute;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.28);font-family:'Cairo',sans-serif;font-weight:700;font-size:14px;direction:rtl;text-align:right}
.ffb{height:8px;border:2px solid #ffd9e6;border-radius:6px;overflow:hidden;margin-top:6px}
.ffb i{display:block;height:100%;background:#ff8fab;transition:width .5s}
.wkc{display:flex;gap:5px;height:110px;margin:8px 0}
.wk{flex:1;display:flex;flex-direction:column;align-items:center;font-size:8px}
.wk b{font-size:8px;height:12px}
.wk span{flex:1;width:100%;position:relative;background:rgba(127,127,127,.18);border-radius:5px;overflow:hidden}
.wk i{position:absolute;left:0;right:0;bottom:0;background:#b39ddb;border-radius:4px}
.wk.td i{background:#ff8fab}
.wk u{position:absolute;left:0;right:0;border-top:2px dashed #66bb6a}
.wk small{font-family:'Cairo',sans-serif;font-size:10px;margin-top:3px;opacity:.85}
.cf{position:fixed;top:-30px;z-index:9;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(360deg)}}
.win,.card,.win2{animation:pop .3s}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
#dp{animation:up .25s}
@keyframes up{from{transform:translateY(30px);opacity:0}}
#ttl{animation:beat 2.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.b{transition:transform .1s}.b:hover{transform:translateY(-1px)}
.pp{animation:pp .45s}
@keyframes pp{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
.fi{animation:fi .8s}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
#end{position:fixed;inset:0;z-index:8;background:radial-gradient(circle at 50% 28%,#5a1a3a,#1d0a18 70%);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;animation:gf .8s}
.endc{position:relative;z-index:2;width:min(92vw,440px);margin:auto;background:#fff8ef;border-radius:24px;padding:26px 18px 22px;text-align:center;box-shadow:0 0 0 4px #f8bbd0,0 0 0 8px #fff8ef,0 20px 60px rgba(0,0,0,.6);animation:pop .7s}
.endc::before{content:'';position:absolute;inset:9px;border:2px dashed #e9a6bf;border-radius:17px;pointer-events:none}
#endrose{display:block;margin:0 auto;width:96px;height:auto;background:transparent;border:0;border-radius:0;box-shadow:none;image-rendering:pixelated;filter:drop-shadow(0 0 12px #ff80ab);animation:glow 3.2s ease-in-out infinite}
@keyframes glow{50%{transform:translateY(-4px)}}
#note p.rare{color:#e65100;font-weight:700}
#note p.sm{font-size:clamp(14px,4vw,17px);color:#8a5a70}
.rrow{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:'Cairo',sans-serif;font-size:13px;border:2px solid var(--fg);border-radius:10px;padding:5px 8px}
.rrow.lk{opacity:.5;justify-content:center}
.rrow button{padding:6px 10px}
#note{margin:12px 0 20px;font-family:'Aref Ruqaa','Cairo',serif;color:#6b2a4a;direction:rtl}
#note p{margin:2px 0;font-size:clamp(17px,4.9vw,23px);line-height:2.05;opacity:0;animation:fin 1.2s forwards}
@keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#note p{opacity:1;animation:none}}
#note p.hr{font-size:22px;color:#e91e63}
.erow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.rb{font-family:'Cairo',sans-serif;font-weight:700;font-size:14px;border:none;border-radius:999px;padding:10px 18px;background:#ff8fab;color:#fff;cursor:pointer;box-shadow:0 3px 0 #d6639a}
.rb.alt{background:#fff;color:#c2185b;border:2px solid #ff8fab;box-shadow:none}
#petals i{position:fixed;top:-24px;width:10px;height:14px;border-radius:50% 0 50% 50%;opacity:.8;pointer-events:none;z-index:1;animation:fall linear infinite}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.chips button{font:inherit;font-size:9px;padding:8px 10px;border:3px solid #ffd9e6;border-radius:10px;background:transparent;color:#ffd9e6;cursor:pointer}
.chips button.on{background:#ff8fab;color:#2d1b4e;border-color:#ff8fab}
.breath{width:90px;height:90px;border-radius:50%;background:radial-gradient(#ff8fab,#7e57c2);margin:26px auto;animation:br 8s ease-in-out infinite}
@keyframes br{0%,100%{transform:scale(.7)}50%{transform:scale(1.3)}}
.bar3{height:10px;border:2px solid var(--fg);border-radius:6px;overflow:hidden;margin:6px 0}
.bar3 i{display:block;height:100%;background:#ff8fab}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.stats div{border:2px solid var(--fg);border-radius:8px;padding:6px 2px;font-size:11px}
.stats b{display:block;font-size:9px;margin:3px 0}
.stats small,.badges small{display:block;font-family:'Cairo',sans-serif;font-size:10px;opacity:.8}
.badges{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;font-size:20px}
.badges .lk{opacity:.4}
.gb:disabled{opacity:.6;cursor:default}
#dp{position:fixed;left:0;right:0;bottom:0;z-index:4;background:var(--card);color:var(--fg);border-top:4px solid var(--fg);border-radius:14px 14px 0 0;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));max-height:44vh;overflow:auto}
.dph{display:flex;gap:6px;align-items:center;justify-content:space-between;font-size:9px;margin-bottom:8px}
.dph button,#dpl button{font:inherit;font-size:9px;border:3px solid var(--fg);border-radius:10px;background:var(--card);color:var(--fg);padding:8px;cursor:pointer}
.dph button.on{background:#ff8fab;color:#2d1b4e}
#dpm{font-family:'Cairo',sans-serif;font-size:13px;min-height:20px;margin-bottom:6px;text-align:center}
#dpl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
#dpl small{display:block;font-size:8px;opacity:.8;margin-top:3px}
#dpl .sw{width:34px;height:34px;padding:0;border-radius:8px}
.letter{font-family:'Cairo',sans-serif;font-weight:700;font-size:17px;line-height:2;direction:rtl;background:#fff8e1;color:#5a2a44;border:3px solid #5a2a44;border-radius:10px;padding:16px;margin-top:14px}
.win2>div{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.win2 .gb{width:auto;padding:10px 18px;font-size:10px;background:#fff;color:#5a2a44;border-color:#5a2a44}
#gal{animation:gf .4s;position:fixed;inset:0;z-index:5;background:rgba(30,12,22,.94);display:flex;flex-direction:column;align-items:center;justify-content:center}
@keyframes gf{from{opacity:0}to{opacity:1}}
#strip{display:flex;width:100%;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#strip::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:0 4vw;box-sizing:border-box}
.pol{background:#fff;padding:2.5vmin 2.5vmin 7vmin;border-radius:4px;box-shadow:0 8px 30px #0008;transform:rotate(var(--r,-1deg))}
.pol img{display:block;max-width:80vw;max-height:58vh;object-fit:contain}
.ph{width:min(70vw,340px);height:min(46vh,280px);display:flex;align-items:center;justify-content:center;font-size:64px;background:linear-gradient(135deg,#ffd9e6,#e1bee7)}
.cap{font-family:'Cairo',sans-serif;font-weight:700;color:#ffd9e6;font-size:clamp(14px,3.8vw,19px);text-align:center;direction:rtl}
#dots{display:flex;gap:8px;margin-top:16px}
#dots i{width:8px;height:8px;border-radius:50%;background:#ffd9e655}
#dots i.on{background:#ff8fab;transform:scale(1.5)}
#gx{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:12px;width:auto;padding:0 12px;font-size:10px}
#gp,#gn{position:absolute;top:50%;transform:translateY(-50%);opacity:.8}
#gp{left:8px}#gn{right:8px}
</style><link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ff8fab">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Little Rose">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>#appbar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:#fff;color:#5a2a44;border:3px solid #ff8fab;border-radius:999px;padding:8px 14px;font-family:'Cairo',sans-serif;font-weight:700;font-size:14px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:92vw}#appbar[hidden]{display:none}#appbar button{font:inherit;border:none;border-radius:999px;padding:6px 14px;background:#ff8fab;color:#fff;cursor:pointer}#appbar .x{background:transparent;color:#999;padding:6px}</style>
</head><body>
<div id="w">
<div id="ttl">♥ Her Little Rose ♥</div><div id="tn"></div>
<div id="hud"><span id="h1"></span><div><span id="h2"></span><button class="b s" id="mu">♪</button><button class="b s" id="nt">⏭</button><button class="b s" id="wx" title="Rain on/off">☀️</button><button class="b s" id="dec" hidden>🎨</button></div></div>
<div id="cw"><canvas id="c"></canvas><div id="greet" dir="rtl"><div id="g1"></div><div id="g2"></div></div></div>
<div id="msg" dir="auto"></div>
<div id="pad"><div><button class="b" data-k="arrowleft">◀</button><button class="b" data-k="arrowright">▶</button></div><div><button class="b" data-k="arrowup">▲</button><button class="b" data-k="e">✿</button></div></div>
</div>
<div id="end" hidden><div id="petals"></div><div class="endc"><canvas id="endrose" width="24" height="34"></canvas><div id="note"></div><div class="erow"><button class="rb" id="ek">كمّلي لعب ♥</button><button class="rb" id="er">🌹 أوضة الورد</button><button class="rb alt" id="rp">ازرعي وردة تانية 🌱</button><button class="rb alt" id="el" hidden>💌 الرسالة</button></div></div></div>
<div id="dp" hidden><div class="dph"><button data-t="0">🛍️ Items</button><button data-t="1">🎨 Colors</button><button data-t="2" id="tabr" hidden>🌹 ورودي</button><span id="dpc"></span><button id="dpd">✓ Done</button></div><div id="dpm"></div><div id="dpl"></div></div>
<div id="fx" hidden><div id="fxc"></div><div id="ff"></div></div>
<div id="pc" hidden><div class="win"><div class="bar"><span>💻 Her Laptop</span><button class="b s" id="px">✕</button></div><div id="pb"></div></div></div>
<div id="gal" hidden><button class="b s" id="gx">✕ Stand up</button><div id="strip"></div><div id="dots"></div><div id="gcnt" class="cap" style="font-size:12px;opacity:.8;margin-top:8px"></div><div class="cap" style="font-size:12px;opacity:.7;margin-top:10px">اسحبي يمين وشمال ←→</div><button class="b s" id="gp">◀</button><button class="b s" id="gn">▶</button></div>
<script>
// ===== Edit these messages =====
const GREETING="صباح الخير ي نونو اتمني يكون يومك سعيد يارب";
const NOTE="7 ايام من الاهتمام والحب مجرد اهتمامك بالحاجه خلي الورده تبقي موجوده. انا بحبك و بحب كل حاجه فيكي عمري ما هقدر استغني عنك ولا في اي خطوه اخدتيها, هفضل جنبك وهفضل اسندك بكل طاقتي مهما حصل شكرا علي وجودك في حياتي وشكرا علي كل حاجه";
const NOTE_LINES=["7 ايام من الاهتمام والحب","مجرد اهتمامك بالحاجه خلي الورده تبقي موجوده.","انا بحبك و بحب كل حاجه فيكي","عمري ما هقدر استغني عنك ولا في اي خطوه اخدتيها,","هفضل جنبك وهفضل اسندك بكل طاقتي مهما حصل","شكرا علي وجودك في حياتي وشكرا علي كل حاجه"];
const LAPTOP='The laptop screen says: "Good morning, beautiful ♥"';
// One new letter unlocks for each different day she opens the game. Edit or add more!
const LETTERS=[
"صباح الخير يا نونو ☀️ أول جواب ليكي.. وجودك في حياتي أحلى حاجة حصلت ليا.",
"النهاردة افتكرتك وابتسمت من غير سبب.. ده تأثيرك عليا 💗",
"مهما كان يومك تقيل، افتكري إن فيه حد بيحبك وجنبك دايمًا.",
"ضحكتك من أجمل الحاجات في الدنيا.. خليها دايمًا موجودة 😊",
"إنتي أقوى مما بتتخيلي، وبفتخر بيكي أوي.",
"شكرًا إنك بتتحمليني وبتفضلي جنبي.. ربنا يخليكي ليا ❤️",
